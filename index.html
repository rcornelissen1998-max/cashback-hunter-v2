
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10251f">
<title>Cashback Hunter</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f2;margin:0;color:#17251f}
header{background:#10251f;color:white;padding:28px 20px;border-radius:0 0 22px 22px}
h1{margin:10px 0}main{padding:16px;max-width:650px;margin:auto}
.card{background:white;padding:18px;border-radius:16px;margin:14px 0;box-shadow:0 2px 8px #0000000c}
.stat{font-size:28px;font-weight:bold;color:#176b4b}
button{background:#176b4b;color:white;border:0;padding:12px 16px;border-radius:10px;font-weight:bold}
input{padding:12px;border:1px solid #ddd;border-radius:9px;width:100%;box-sizing:border-box;margin:8px 0}
.item{padding:12px 0;border-bottom:1px solid #eee}
.small{font-size:13px;color:#68766f}
</style>
</head>
<body>
<header>
<div>🎯 CASHBACK HUNTER</div>
<h1>Elke aankoop telt!</h1>
<p>Jouw persoonlijke cashback-overzicht.</p>
</header>
<main>
<div class="card">
<h3>💰 Bevestigde cashback</h3>
<div class="stat" id="total">€ 0,00</div>
<p class="small">Alleen cashback die je zelf bevestigt.</p>
</div>
<div class="card">
<h3>📥 ING-transacties importeren</h3>
<input type="file" id="csv" accept=".csv">
<p class="small" id="message">Je gegevens blijven lokaal op je apparaat.</p>
</div>
<div class="card">
<h3>🛍️ Jouw winkels</h3>
<input id="search" placeholder="Zoek een winkel...">
<div id="stores">Nog geen transacties geïmporteerd.</div>
</div>
<div class="card">
<h3>➕ Cashback registreren</h3>
<input id="shop" placeholder="Winkel">
<input id="amount" type="number" step="0.01" placeholder="Cashback in euro's">
<button onclick="addCashback()">Toevoegen</button>
<div id="cashbacks"></div>
</div>
</main>
<script>
const KEY="cashback-hunter-v2";
let data=JSON.parse(localStorage.getItem(KEY)||'{"transactions":[],"cashbacks":[]}');
const money=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(n);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function addCashback(){
 let shop=document.getElementById('shop').value.trim();
 let amount=Number(document.getElementById('amount').value);
 if(!shop||amount<=0)return alert('Vul winkel en bedrag in.');
 data.cashbacks.push({shop,amount});
 document.getElementById('shop').value='';
 document.getElementById('amount').value='';
 save();
}
function render(){
 document.getElementById('total').textContent=money(data.cashbacks.reduce((s,x)=>s+x.amount,0));
 document.getElementById('cashbacks').innerHTML=data.cashbacks.map(x=>'<div class="item">'+x.shop+' — '+money(x.amount)+' <span class="small">Bevestigd</span></div>').join('');
 let q=document.getElementById('search').value.toLowerCase();
 let list=data.transactions.filter(x=>x.shop.toLowerCase().includes(q));
 document.getElementById('stores').innerHTML=list.length?list.map(x=>'<div class="item"><b>'+x.shop+'</b><br>'+money(x.amount)+'<div class="small">Mogelijke cashback — nog niet bevestigd</div></div>').join(''):'Nog geen winkels gevonden.';
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('csv').addEventListener('change',async e=>{
 let f=e.target.files[0];if(!f)return;
 let text=await f.text(),lines=text.split(/\r?\n/).filter(Boolean);
 let sep=lines[0].includes(';')?';':',';
 let rows=lines.map(x=>x.split(sep));
 let headers=rows.shift().map(x=>x.replace(/"/g,'').toLowerCase());
 let si=headers.findIndex(x=>x.includes('omschrijving')||x.includes('naam'));
 let ai=headers.findIndex(x=>x.includes('bedrag')||x.includes('mutatie'));
 if(si<0)si=0;if(ai<0)ai=headers.length-1;
 let added=0;
 rows.forEach(r=>{
  let shop=(r[si]||'').replace(/"/g,'').trim();
  let raw=(r[ai]||'0').replace(/"/g,'').replace(',','.');
  let amount=Number(raw);
  if(shop&&Number.isFinite(amount)&&amount!==0){
   data.transactions.push({shop,amount});added++;
  }
 });
 save();
 document.getElementById('message').textContent=added+' transacties ingelezen.';
});
render();
</script>
</body>
</html>
